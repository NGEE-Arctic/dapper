name: Build & Deploy Docs

on:
  push:
    branches: [ dev-met-refactor ]               # change/add branches if you want
    paths:
      - 'docs/**'
      - 'src/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            docs/requirements.txt
            pyproject.toml

      - name: Install doc deps
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      # Optional: auto-generate API stubs so api/index stays fresh
      - name: Generate API docs
        run: sphinx-apidoc -o docs/api src/dapper

      - name: Build Sphinx
        run: sphinx-build -b html docs docs/_build/html

      # For pushes (main): hand off to Pages
      - name: Upload artifact for Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

      # For PRs: attach a downloadable preview artifact
      - name: Upload preview artifact (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

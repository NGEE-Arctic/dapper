name: dapper
channels:
  - conda-forge
dependencies:
  - geopandas
  - shapely
  - pyproj
  - pandas>=3
  - python-dateutil
  - matplotlib
  - earthengine-api
  - geemap
  - cdsapi>=0.7.7
  - pip
  - xarray
  - cftime
  - tqdm
  - rioxarray
  - jupyter
  - fastparquet
  - netcdf4
  - intake
  - intake-esm # for Pangeo CMIP access
  - fsspec
  - gcsfs # for Pangeo CMIP downloading
  - folium # interactive mapping
  - contextily # static mapping
  - xyzservices # basemaps
  - pytest

